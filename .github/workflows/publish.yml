name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      pypi_token:
        description: 'Enter your PyPI API token (pypi-...)'
        required: true
        type: string

jobs:
  pypi-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package wheels and source tarball
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ github.event.inputs.pypi_token }}
        run: twine upload dist/*
